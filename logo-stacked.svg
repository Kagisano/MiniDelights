<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="MiniDelights stacked logo">
  <defs>
    <style>
      .st-mini     { font-family: 'Fredoka', 'Nunito', Arial, sans-serif; font-weight: 600; font-size: 38px; fill: #5C2A1E; }
      .st-delights { font-family: 'Fredoka', 'Nunito', Arial, sans-serif; font-weight: 600; font-size: 38px; fill: #EE6FA0; }
      .st-tag      { font-family: 'Nunito Sans', Arial, sans-serif; font-weight: 700; font-size: 10px; fill: #5C2A1E; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Donut body -->
  <circle cx="100" cy="82" r="52" fill="#F9A8C9"/>
  <!-- Glaze top -->
  <ellipse cx="94" cy="56" rx="24" ry="14" fill="#F472B6" opacity="0.45"/>
  <!-- Donut hole -->
  <circle cx="100" cy="82" r="19" fill="#FFF8F0"/>

  <!-- Sprinkles -->
  <rect x="72" y="42" width="7" height="2.5" rx="1.2" fill="#EE6FA0" transform="rotate(30 75 43)"/>
  <rect x="120" y="44" width="7" height="2.5" rx="1.2" fill="#6FE0B0" transform="rotate(-25 123 45)"/>
  <rect x="136" y="72" width="7" height="2.5" rx="1.2" fill="#FFD166" transform="rotate(50 139 73)"/>
  <rect x="126" y="104" width="7" height="2.5" rx="1.2" fill="#FFF8F0" transform="rotate(-40 129 105)"/>
  <rect x="72" y="108" width="7" height="2.5" rx="1.2" fill="#F472B6" transform="rotate(15 75 109)"/>
  <rect x="56" y="76" width="7" height="2.5" rx="1.2" fill="#6FE0B0" transform="rotate(-50 59 77)"/>
  <rect x="84" y="36" width="7" height="2.5" rx="1.2" fill="#FFD166" transform="rotate(10 87 37)"/>

  <!-- Eyes -->
  <circle cx="90" cy="78" r="4.5" fill="#5C2A1E"/>
  <circle cx="110" cy="78" r="4.5" fill="#5C2A1E"/>
  <circle cx="91.5" cy="76.5" r="1.5" fill="white"/>
  <circle cx="111.5" cy="76.5" r="1.5" fill="white"/>

  <!-- Smile -->
  <path d="M90 90 Q100 100 110 90" stroke="#5C2A1E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Bite mark -->
  <path d="M134 52 Q152 34 152 56 Q140 48 134 52Z" fill="#FFF8F0"/>

  <!-- Arms -->
  <ellipse cx="50" cy="88" rx="9" ry="5" fill="#F9A8C9" transform="rotate(-25 50 88)"/>
  <ellipse cx="150" cy="88" rx="9" ry="5" fill="#F9A8C9" transform="rotate(25 150 88)"/>

  <!-- Feet -->
  <ellipse cx="88" cy="133" rx="9" ry="5" fill="#F9A8C9"/>
  <ellipse cx="112" cy="133" rx="9" ry="5" fill="#F9A8C9"/>

  <!-- Wordmark -->
  <text x="100" y="168" text-anchor="middle" class="st-mini">Mini</text>
  <text x="100" y="205" text-anchor="middle" class="st-delights">Delights</text>
</svg>
