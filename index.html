  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rgin:0;line-height:1;}\np{margin:0;}\n\n/* ---------- layout helpers ---------- */\n.wrap{width:var(--maxw);max-width:100%;margin:0 auto;padding:0 24px;}\n.section{padding:84px 0;position:relative;}\n.section.tight{padding:56px 0;}\n.section.cream2{background:var(--cream-2);}\n.section.mint-band{\n  background:linear-gradient(135deg,#E8FBF1 0%, #F3FBF4 100%);\n}\n.section.pink-band{\n  background:linear-gradient(135deg,#FFE3EF 0%, #FFD9EB 100%);\n}\n.section.choco-band{background:var(--choco);color:#FCE3D6;}\n.section.choco-band h1,.section.choco-band h2,.section.choco-band h3{color:#fff;}\n\n.eyebrow{\n  font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;\n  color:var(--pink-deep);margin:0 0 16px;\n}\n.choco-band .eyebrow{color:var(--mint);}\n.section-head{max-width:none;}\n.lead{font-size:clamp(1.05rem,1.4vw,1.22rem);color:var(--choco-2);line-height:1.6;}\n.choco-band .lead{color:#FCE3D6;}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:10px;\n  font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:1.02rem;\n  padding:15px 28px;border-radius:999px;border:none;cursor:pointer;\n  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;\n  white-space:nowrap;line-height:1;\n}\n.btn:hover{transform:translateY(-2px);}\n.btn:active{transform:translateY(0);}\n.btn-primary{background:var(--pink-deep);color:#fff;box-shadow:0 14px 26px -12px rgba(238,111,160,.7);}\n.btn-primary:hover{background:#E85C95;box-shadow:0 18px 30px -12px rgba(238,111,160,.8);}\n.btn-choco{background:var(--choco);color:var(--cream);box-shadow:0 14px 26px -14px rgba(92,42,30,.6);}\n.btn-choco:hover{background:#4a2118;}\n.btn-mint{background:var(--mint-deep);color:var(--choco);box-shadow:0 14px 26px -14px rgba(111,224,176,.7);}\n.btn-mint:hover{background:#56d3a0;}\n.btn-ghost{background:transparent;color:var(--choco);box-shadow:inset 0 0 0 2px rgba(92,42,30,.22);}\n.btn-ghost:hover{box-shadow:inset 0 0 0 2px rgba(92,42,30,.45);background:rgba(92,42,30,.04);}\n.choco-band .btn-ghost{color:var(--cream);box-shadow:inset 0 0 0 2px rgba(255,241,230,.35);}\n.choco-band .btn-ghost:hover{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,241,230,.6);}\n.btn-wa svg{width:20px;height:20px;flex:none;}\n.btn-row{display:flex;flex-wrap:wrap;gap:14px;}\n\n/* ---------- cards ---------- */\n.card{\n  background:#fff;border-radius:var(--radius);padding:34px 32px;\n  box-shadow:var(--shadow-card);border:var(--border-soft);\n  position:relative;overflow:hidden;\n}\n\n/* ---------- pill badge ---------- */\n.pill{\n  display:inline-flex;align-items:center;gap:8px;\n  background:rgba(92,42,30,.06);color:var(--choco);\n  font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;\n  padding:9px 16px;border-radius:999px;\n}\n\n/* =====================================================\n   HEADER / NAV\n   ===================================================== */\n.site-header{\n  position:sticky;top:0;z-index:100;\n  background:rgba(255,248,240,.82);\n  backdrop-filter:saturate(180%) blur(14px);\n  -webkit-backdrop-filter:saturate(180%) blur(14px);\n  border-bottom:1px solid rgba(92,42,30,.07);\n}\n.nav{\n  height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:24px;\n}\n.brand-lockup{display:flex;align-items:center;gap:12px;flex:none;}\n.brand-lockup .sym{width:42px;height:42px;flex:none;}\n.brand-lockup .wm{font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:24px;color:var(--choco);line-height:1;letter-spacing:-.01em;}\n.brand-lockup .wm b{color:var(--pink-deep);font-weight:600;}\n.nav-links{display:flex;align-items:center;gap:6px;}\n.nav-links a{\n  font-family:\"Fredoka\",sans-serif;font-weight:500;font-size:1rem;color:var(--choco);\n  padding:9px 14px;border-radius:999px;transition:background .15s ease,color .15s ease;\n}\n.nav-links a:hover{background:rgba(92,42,30,.06);}\n.nav-links a.active{color:var(--pink-deep);background:rgba(238,111,160,.1);}\n.nav-cta{display:flex;align-items:center;gap:10px;flex:none;}\n.nav-toggle{\n  display:none;background:none;border:none;cursor:pointer;padding:8px;border-radius:12px;\n}\n.mobile-menu{display:flex;flex-direction:column;visibility:hidden;pointer-events:none;position:fixed;inset:var(--nav-h,64px) 0 0 0;z-index:999;background:var(--cream,#FFF8F0);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1),visibility .3s;overflow-y:auto;padding:16px 20px;gap:0;}\n.nav-toggle span{display:block;width:26px;height:2.5px;background:var(--choco);border-radius:3px;margin:5px 0;transition:.25s;}\n.nav-toggle.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}\n.nav-toggle.open span:nth-child(2){opacity:0;}\n.nav-toggle.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}\n\n/* =====================================================\n   HERO (shared base)\n   ===================================================== */\n.hero{\n  position:relative;overflow:hidden;\n  padding:72px 0 84px;\n}\n.hero.gradient{\n  background:linear-gradient(135deg,#FFE3EF 0%, var(--cream) 52%, #E8FBF1 100%);\n}\n.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;}\n.hero h1{\n  font-size:clamp(2.6rem,6vw,5rem);color:var(--choco);line-height:.95;letter-spacing:-.015em;\n}\n.hero h1 .pink{color:var(--pink-deep);}\n.hero .sub{font-size:clamp(1.1rem,1.7vw,1.4rem);color:var(--choco-2);margin-top:22px;max-width:34ch;line-height:1.5;}\n.hero .btn-row{margin-top:32px;}\n.hero-art{display:flex;align-items:center;justify-content:center;position:relative;}\n.hero-art .mascot-img{width:min(360px,82%);filter:drop-shadow(0 30px 30px rgba(92,42,30,.22));animation:bob 4.5s ease-in-out infinite;}\n@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-14px) rotate(1deg);}}\n@media (prefers-reduced-motion:reduce){.hero-art .mascot-img{animation:none;}}\n\n.hero-center{text-align:center;}\n.hero-center .sub{margin-left:auto;margin-right:auto;max-width:48ch;}\n.hero-center .btn-row{justify-content:center;}\n\n/* =====================================================\n   INTRO STRIP / FEATURE TICKER\n   ===================================================== */\n.strip{\n  background:var(--choco);color:var(--cream);\n  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px 38px;\n  padding:20px 24px;\n}\n.strip .item{display:flex;align-items:center;gap:10px;font-family:\"Fredoka\",sans-serif;font-weight:500;font-size:1.05rem;}\n.strip .item .ic{font-size:1.2rem;}\n.strip .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);}\n\n/* =====================================================\n   GENERIC GRIDS\n   ===================================================== */\n.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:30px;}\n.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}\n.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}\n.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}\n\n/* ---------- image placeholders (brand style) ---------- */\n.ph{\n  border-radius:var(--radius);\n  background:\n    repeating-linear-gradient(45deg, rgba(92,42,30,.06) 0 10px, rgba(92,42,30,.02) 10px 20px),\n    var(--cream-2);\n  border:1.5px dashed rgba(92,42,30,.22);\n  display:flex;align-items:flex-end;padding:18px;min-height:260px;\n}\n.ph span{\n  font-family:ui-monospace,\"SFMono-Regular\",Menlo,monospace;font-size:11px;font-weight:700;\n  letter-spacing:.04em;color:rgba(92,42,30,.55);background:#fff;padding:6px 10px;border-radius:8px;\n}\n.ph.round{border-radius:50%;aspect-ratio:1;min-height:0;}\n\n/* =====================================================\n   GLAZE CHIPS\n   ===================================================== */\n.glaze-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;}\n.glaze-chip{\n  display:flex;flex-direction:column;align-items:center;gap:12px;\n}\n.glaze-chip .disc{\n  width:84px;height:84px;border-radius:50%;position:relative;\n  box-shadow:inset 0 -10px 0 rgba(0,0,0,.08), 0 14px 26px -14px rgba(92,42,30,.5);\n}\n.glaze-chip .disc::after{\n  content:\"\";position:absolute;width:30px;height:30px;border-radius:50%;\n  left:50%;top:50%;transform:translate(-50%,-50%);background:var(--cream);\n  box-shadow:inset 0 3px 5px rgba(92,42,30,.14);\n}\n.glaze-chip .nm{font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:1.05rem;color:var(--choco);}\n\n/* =====================================================\n   PACK / PRICE TABLE\n   ===================================================== */\n.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}\n.pack{\n  background:#fff;border-radius:var(--radius);padding:30px 26px;text-align:center;\n  border:var(--border-soft);box-shadow:var(--shadow-card);position:relative;\n  transition:transform .18s ease, box-shadow .18s ease;\n}\n.pack:hover{transform:translateY(-6px);box-shadow:var(--shadow-lift);}\n.pack .donuts{font-size:1.8rem;line-height:1;margin-bottom:8px;letter-spacing:2px;}\n.pack .pname{font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:1.4rem;color:var(--choco);}\n.pack .count{font-size:.95rem;color:var(--choco-2);margin-top:4px;}\n.pack .price{font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:2.6rem;color:var(--pink-deep);margin-top:16px;line-height:1;}\n.pack.feature{background:linear-gradient(160deg,#FFE3EF,#fff);outline:2px solid var(--pink);}\n.pack .tagtop{\n  position:absolute;top:-13px;left:50%;transform:translateX(-50%);\n  background:var(--pink-deep);color:#fff;font-family:\"Fredoka\",sans-serif;font-weight:600;\n  font-size:.78rem;letter-spacing:.06em;padding:5px 14px;border-radius:999px;white-space:nowrap;\n}\n\n/* =====================================================\n   REVIEWS\n   ===================================================== */\n.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}\n.review{\n  background:#fff;border-radius:var(--radius);padding:30px;border:var(--border-soft);box-shadow:var(--shadow-card);\n}\n.review .stars{color:var(--butter);font-size:1.05rem;letter-spacing:2px;margin-bottom:14px;}\n.review blockquote{margin:0;font-family:\"Fredoka\",sans-serif;font-weight:500;font-size:1.25rem;color:var(--choco);line-height:1.3;}\n\n/* =====================================================\n   STEPS\n   ===================================================== */\n.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;}\n.step{\n  background:#fff;border-radius:var(--radius-sm);padding:26px 22px;border:var(--border-soft);box-shadow:var(--shadow-card);\n  position:relative;\n}\n.step .n{\n  width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--choco);\n  font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:1.2rem;\n  display:flex;align-items:center;justify-content:center;margin-bottom:16px;\n}\n.step h3{font-size:1.15rem;color:var(--choco);margin-bottom:6px;}\n.step p{font-size:.95rem;color:var(--choco-2);line-height:1.45;}\n\n/* =====================================================\n   VALUES\n   ===================================================== */\n.values{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}\n.value{\n  background:#fff;border-radius:var(--radius);padding:30px 26px;border:var(--border-soft);box-shadow:var(--shadow-card);\n}\n.value .ic{font-size:2rem;margin-bottom:14px;display:block;}\n.value h3{font-size:1.2rem;color:var(--choco);margin-bottom:8px;}\n.value p{font-size:.97rem;color:var(--choco-2);line-height:1.5;}\n\n/* =====================================================\n   CTA BANNER\n   ===================================================== */\n.cta-banner{\n  border-radius:var(--radius);padding:56px clamp(28px,5vw,72px);text-align:center;\n  background:linear-gradient(135deg,var(--pink) 0%, var(--sugar) 100%);\n  color:var(--choco);position:relative;overflow:hidden;box-shadow:var(--shadow-lift);\n}\n.cta-banner h2{font-size:clamp(1.9rem,3.6vw,3rem);color:var(--choco);line-height:1.04;max-width:20ch;margin:0 auto;}\n.cta-banner p{margin:18px auto 0;max-width:52ch;color:#6B2E1F;font-size:1.1rem;}\n.cta-banner .btn-row{justify-content:center;margin-top:30px;}\n\n/* =====================================================\n   CHARACTER DETAIL (Gang page rows)\n   ===================================================== */\n.gang-list{display:flex;flex-direction:column;gap:28px;}\n.gang-card{\n  background:#fff;border-radius:var(--radius);border:var(--border-soft);box-shadow:var(--shadow-card);\n  display:grid;grid-template-columns:280px 1fr;gap:0;overflow:hidden;\n}\n.gang-card .portrait{\n  display:flex;align-items:center;justify-content:center;padding:28px;position:relative;\n}\n.gang-card .portrait .num{\n  position:absolute;top:18px;left:22px;font-family:\"Fredoka\",sans-serif;font-weight:600;\n  font-size:1.1rem;color:rgba(92,42,30,.4);\n}\n.gang-card .detail{padding:34px 38px;display:flex;flex-direction:column;justify-content:center;}\n.gang-card .detail .name{font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:2rem;color:var(--choco);line-height:1;}\n.gang-card .detail .alias{font-family:\"Fredoka\",sans-serif;font-weight:500;font-size:1.05rem;color:var(--pink-deep);margin-top:4px;}\n.gang-card .specs{display:flex;flex-direction:column;gap:10px;margin:20px 0;}\n.gang-card .spec{display:flex;gap:10px;font-size:1rem;color:var(--choco-2);align-items:baseline;}\n.gang-card .spec .k{font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;color:var(--pink-deep);min-width:92px;flex:none;}\n.gang-card .spec .v{color:var(--choco);}\n.gang-card .pricetag{font-family:\"Fredoka\",sans-serif;font-weight:600;color:var(--choco);font-size:1rem;}\n\n/* gang toon scaling inside portrait */\n.gang-toon{width:230px;height:250px;transform:scale(.84);transform-origin:center;}\n.gang-card .portrait{min-height:280px;}\n\n/* line-up strip */\n.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 0;justify-items:center;}\n.lineup-cell{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;}\n.lineup-toon{width:230px;height:250px;transform:scale(.5);transform-origin:center;margin:-62px 0;}\n.lineup-nm{font-family:\"Fredoka\",sans-serif;font-weight:600;font-size:1rem;color:var(--choco);}\n@media (max-width:760px){.lineup{grid-template-columns:repeat(2,1fr);}}\n\n/* =====================================================\n   CONTACT BLOCKS\n   ===================================================== */\n.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}\n.contact-card{\n  background:#fff;border-radius:var(--radius);padding:34px;border:var(--border-soft);box-shadow:var(--shadow-card);\n  display:flex;flex-direction:column;gap:16px;\n}\n.contact-card h3{font-size:1.4rem;color:var(--choco);}\n.contact-card p{color:var(--choco-2);}\n.social-list{display:flex;flex-direction:column;gap:12px;}\n.social-list a{display:flex;align-items:center;gap:12px;font-family:\"Fredoka\",sans-serif;font-weight:500;font-size:1.1rem;color:var(--choco);transition:color .15s;}\n.social-list a:hover{color:var(--pink-deep);}\n.social-list .handle{color:var(--choco-2);font-family:\"Nunito Sans\",sans-serif;font-weight:600;font-size:.95rem;}\n\n/* =====================================================\n   FIND US track / spots\n   ===================================================== */\n.track-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}\n.track{\n  background:#fff;border-radius:var(--radius);padding:32px;border:var(--border-soft);box-shadow:var(--shadow-card);\n}\n.track .ic{font-size:2rem;margin-bottom:14px;display:block;}\n.track h3{font-size:1.25rem;color:var(--choco);margin-bottom:8px;}\n.track p{color:var(--choco-2);}\n.weekend-card{\n  background:linear-gradient(150deg,#E8FBF1,#fff);border:2px dashed
